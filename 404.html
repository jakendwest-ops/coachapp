<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>CoachApp</title>
  <meta name="color-scheme" content="dark light">
  <script>
    // Theme before first paint (2026-10-29): same rule as applyTheme() in js/app-core.js; the choice is kept on this device.
    (function () {
      var c = 'dark', t
      try { c = localStorage.getItem('coachapp-theme') || 'dark' } catch (e) {}
      t = c === 'light' || (c === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'
      document.documentElement.setAttribute('data-theme', t)
    })()
  </script>
  <style>html { background: #11131a } html[data-theme="light"] { background: #f4f5f7 }</style>
</head>
<body>
<script>
  // GitHub Pages serves this on any path that isn't a real file.
  // Save the intended path and redirect to the SPA root — showApp() will restore it.
  const path = window.location.pathname.replace('/coachapp', '') || '/'
  sessionStorage.setItem('_spa_redirect', path)
  window.location.replace('/coachapp/')
</script>
</body>
</html>
