name: Check & Deploy

# RELEASE CYCLE, adopted 2026-09-05. Pushing to master NO LONGER DEPLOYS.
#
# Every push to master still runs the checks, so master stays continuously verified — but the deploy
# job now fires only on a `v*` tag. Live therefore reflects the last TAG, not the last commit, and
# shipping is a deliberate act: `node scripts/release.mjs <version>` and push the tag it creates.
#
# Why the gate is here and not in a document: before this, a release was whatever happened to be on
# master, and "don't push that yet" was a thing to remember rather than a thing that refuses. This
# project's own measured rule is that written rules do not reduce errors — only checks that refuse do.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  # Manual trigger. Needed to verify a configuration change without inventing a commit — adding the
  # test-account secrets, for instance, only takes effect on the NEXT run, and `gh workflow run`
  # returns HTTP 422 without this. Also the only way to re-run the checks against master on demand.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # WITHOUT THIS, CI IS RED. checks.sh rules 9f-9k are Node scripts, and 9h imports acorn.
      # The job had no install step, so from the moment acorn became a dependency every CI run failed
      # with ERR_MODULE_NOT_FOUND and -- because `deploy` has `needs: check` -- nothing deployed.
      # Two pushes went out that way on 2026-09-04 before anyone looked at the Actions tab. No user
      # impact only because both were tooling-only commits with no js/ or css/ change in them.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # A tag can be pushed at any commit, and the deploy job trusts it. The full-suite, review-marker
      # and release-notes gates all live in scripts/release.mjs, which CI never runs — so a tag pushed
      # by any other route would ship having passed only checks.sh. This is the one link CI can verify
      # by itself: a release tag must point at a commit that carries its own release notes. It does not
      # prove the suite ran; it does prove the release went through the documented path.
      - name: A release tag must carry its own notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$f" ]; then
            echo "::error::$f is missing. A release tag must point at a commit containing its release notes."
            echo "Cut releases with: node scripts/release.mjs ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "$f present."

      - name: Run checks
        env:
          # On a push-triggered run, origin/master IS the commit just pushed, so diffing against it is
          # always empty and rule 3 would report a pass on every push. github.event.before is the true
          # previous commit.
          # Only meaningful for a BRANCH push. On a tag push github.event.before is all-zeros, which
          # would make rule 3 diff against a commit that does not exist; '' makes checks.sh use its
          # own default base instead.
          CB_BASE: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.before || '' }}
        run: sh scripts/checks.sh

  # NO BROWSER TESTS IN CI, since 2026-09-27 (Jake's decision, docs/decisions.md). An `e2e` job used to
  # run runner.spec.js + solo-account.spec.js here — the SAME two files the local pre-push hook then ran
  # before every push — against the ONE live Supabase test account the local suite also uses, so every
  # push started a run that collided with any local suite run. A separate CI account was considered twice
  # and rejected: a fresh account lacks the master/solo setup, so solo-account.spec.js would skip itself
  # and CI would go green having tested less. Browser coverage lives only in scripts/release.mjs (full suite
  # before every release; a push runs no browser tests since the same day). The six test-login secrets are no longer read.

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    # TAGS ONLY, as of 2026-09-05. A push to master runs the checks and stops here; it does not ship.
    # To deploy, create a release tag with scripts/release.mjs and push it.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
